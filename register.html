<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | LazerX</title>
    <link rel="stylesheet" href="index.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://unpkg.com/lenis@1.0.45/dist/lenis.min.js"></script>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-image: url('assets/auth_bg.png');
            background-size: cover;
            background-position: center;
        }

        .auth-card {
            width: 100%;
            max-width: 450px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--neon-purple);
            box-shadow: var(--glow-purple);
            border-radius: 24px;
            padding: 40px;
            position: relative;
            margin: 40px 0;
        }

        .auth-toggles {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .auth-toggles .icon-btn {
            color: var(--text-main) !important;
            background: var(--bg-glass);
        }

        .social-btn {
            width: 100%;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            padding: 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: var(--transition);
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--neon-purple);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: var(--text-muted);
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-glass);
        }

        .divider::before {
            margin-right: .25em;
        }

        .divider::after {
            margin-left: .25em;
        }

        @media (max-width: 768px) {
            .auth-toggles {
                position: fixed !important;
                top: 20px !important;
                right: 20px !important;
                z-index: 1000 !important;
            }

            body {
                padding-top: 80px !important;
                align-items: flex-start !important;
            }
            
            .auth-card {
                margin: 20px auto !important;
                padding: 30px 20px !important;
            }
        }
    </style>
</head>

<body>

    <div class="auth-toggles">
        <button id="theme-toggle" class="icon-btn" aria-label="Toggle Dark Mode">
            <i class="fa-solid fa-sun"></i>
        </button>
        <button id="rtl-toggle" class="icon-btn" aria-label="Toggle RTL">
            <i class="fa-solid fa-right-left"></i>
        </button>
    </div>

    <div class="auth-card">
        <div class="text-center mb-4 mt-4">
            <a href="index.html" class="logo" style="justify-content: center;">
                <i data-lucide="crosshair"></i> LAZER<span style="color: var(--electric-blue)">X</span>
            </a>
            <p class="text-muted mt-2">Enlist in the database</p>
        </div>

        <form>
            <div class="form-group">
                <input type="text" class="form-control" placeholder="Gamer Tag" required>
            </div>
            <div class="form-group">
                <input type="email" class="form-control" placeholder="Email Address" required>
            </div>
            <div class="form-group" style="position: relative;">
                <input type="password" class="form-control" placeholder="Password" id="password-input" required>
                <i class="fa-solid fa-eye toggle-password" data-target="password-input"
                    style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); cursor: pointer;"></i>
            </div>
            <div class="form-group" style="position: relative;">
                <input type="password" class="form-control" placeholder="Confirm Password" id="confirm-password-input" required>
                <i class="fa-solid fa-eye toggle-password" data-target="confirm-password-input"
                    style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); cursor: pointer;"></i>
            </div>

            <button type="submit" class="btn btn-primary"
                style="width: 100%; margin-bottom: 20px; background: var(--neon-purple); border-color: var(--neon-purple);">Create
                Identity</button>
        </form>

        <div class="divider">OR</div>

        <button class="social-btn"><i class="fab fa-google"></i> Continue with Google</button>
        <button class="social-btn"><i class="fab fa-apple"></i> Continue with Apple</button>

        <p class="text-center text-muted mt-4">Already enlisted? <a href="login.html"
                style="color: var(--electric-blue);">Initialize link</a></p>
    </div>

    <script src="script.js"></script>
</body>

</html>
