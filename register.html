<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | LazerXtreme</title>
    <link rel="stylesheet" href="index.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-image: url('assets/auth_bg.png');
            background-size: cover;
            background-position: center;
        }
        .auth-card {
            width: 100%;
            max-width: 450px;
            background: rgba(10, 10, 15, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid var(--neon-purple);
            box-shadow: var(--glow-purple);
            border-radius: 24px;
            padding: 40px;
            position: relative;
            margin: 40px 0;
        }
        .auth-toggles {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }
        .social-btn {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: var(--transition);
        }
        .social-btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: var(--neon-purple);
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: var(--text-muted);
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .divider::before { margin-right: .25em; }
        .divider::after { margin-left: .25em; }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="auth-toggles">
            <button id="theme-toggle" class="icon-btn"><i data-lucide="sun"></i></button>
            <button id="rtl-toggle" class="icon-btn"><i data-lucide="languages"></i></button>
        </div>
        
        <div class="text-center mb-4 mt-4">
            <a href="index.html" class="logo" style="justify-content: center;">
                <i data-lucide="crosshair"></i> LAZER<span style="color: var(--electric-blue)">X</span>
            </a>
            <p class="text-muted mt-2">Enlist in the database</p>
        </div>

        <form>
            <div class="form-group">
                <input type="text" class="form-control" placeholder="Gamer Tag" required>
            </div>
            <div class="form-group">
                <input type="email" class="form-control" placeholder="Email Address" required>
            </div>
            <div class="form-group" style="position: relative;">
                <input type="password" class="form-control" placeholder="Password" required>
                <i data-lucide="eye" style="position: absolute; right: 15px; top: 15px; color: var(--text-muted); cursor: pointer;"></i>
            </div>
            <div class="form-group" style="position: relative;">
                <input type="password" class="form-control" placeholder="Confirm Password" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 20px; background: var(--neon-purple); border-color: var(--neon-purple);">Create Identity</button>
        </form>

        <div class="divider">OR</div>

        <button class="social-btn"><i data-lucide="chrome"></i> Continue with Google</button>
        <button class="social-btn"><i data-lucide="apple"></i> Continue with Apple</button>
        <button class="social-btn" style="color: #5865F2;"><i data-lucide="message-square"></i> Continue with Discord</button>

        <p class="text-center text-muted mt-4">Already enlisted? <a href="login.html" style="color: var(--electric-blue);">Initialize link</a></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
