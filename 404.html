<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Grid Connection Lost | LazerX</title>
    <link rel="stylesheet" href="index.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            background: #050505;
        }

        .error-container {
            text-align: center;
            z-index: 2;
            padding: 20px;
        }

        .glitch-wrapper {
            position: relative;
            display: inline-block;
        }

        .error-code {
            font-size: 10rem;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 20px var(--electric-blue);
            margin: 0;
            font-family: var(--font-heading);
            letter-spacing: 10px;
        }

        .glitch-text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.8;
        }

        .glitch-text::before,
        .glitch-text::after {
            content: '404';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        .glitch-text::before {
            color: var(--laser-red);
            left: 2px;
            text-shadow: -2px 0 var(--laser-red);
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 5s infinite linear alternate-reverse;
        }

        .glitch-text::after {
            color: var(--electric-blue);
            left: -2px;
            text-shadow: -2px 0 var(--electric-blue);
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim2 5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(31px, 9999px, 94px, 0); }
            5% { clip: rect(70px, 9999px, 71px, 0); }
            10% { clip: rect(2px, 9999px, 83px, 0); }
            15% { clip: rect(54px, 9999px, 47px, 0); }
            20% { clip: rect(91px, 9999px, 100px, 0); }
            /* ... more steps if needed ... */
            100% { clip: rect(67px, 9999px, 62px, 0); }
        }

        @keyframes glitch-anim2 {
            0% { clip: rect(10px, 9999px, 85px, 0); }
            100% { clip: rect(80px, 9999px, 20px, 0); }
        }

        .error-message {
            font-size: 1.5rem;
            color: var(--text-muted);
            margin-bottom: 40px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .bg-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 1;
            transform: perspective(500px) rotateX(60deg) translateY(-200px);
            animation: grid-move 20s linear infinite;
        }

        @keyframes grid-move {
            0% { background-position: 0 0; }
            100% { background-position: 0 1000px; }
        }
    </style>
</head>

<body>
    <div class="bg-grid"></div>

    <div class="error-container">
        <a href="index.html" class="logo mb-5" style="font-size: 2rem; justify-content: center; color: #fff; display: inline-flex;">
            <i data-lucide="crosshair"></i> LAZER<span style="color: var(--electric-blue)">X</span>
        </a>
        <div class="glitch-wrapper">
            <h1 class="error-code">404</h1>
            <div class="glitch-text"></div>
        </div>
        <h2 style="color: var(--neon-purple); margin-top: 10px; font-size: 2rem;">GRID CONNECTION LOST</h2>
        <p class="error-message">The sector you are trying to reach has been de-rezzed or never existed in this timeline.</p>
        
        <div style="display: flex; gap: 20px; justify-content: center;">
            <a href="index.html" class="btn btn-primary">
                <i data-lucide="home"></i> Return to Base
            </a>
            <a href="contact.html" class="btn btn-secondary">
                <i data-lucide="message-square"></i> Report Anomaly
            </a>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
